[package]
name = "speech-web"
version = "0.1.0"
edition = "2021"
description = "The book's recognizer compiled to WebAssembly, for the listening page on the website."
publish = false

[lib]
crate-type = ["cdylib"]

# Our own crate, by path. Still nothing from crates.io.
[dependencies]
speech = { path = "../code" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
