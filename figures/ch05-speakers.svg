<title>A voice it knows, and a voice it has never heard</title>
<desc>Two bar charts of DTW digit recognition accuracy for each of six speakers. With 45 templates per digit from the speaker's own voice every speaker is recognised almost perfectly. With templates from the other five speakers only, accuracy drops for everyone and falls to nearly half for two of the speakers.</desc>
