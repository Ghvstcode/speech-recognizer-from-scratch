<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Forward and backward through a linear layer and a ReLU</title>
  <desc>Two layers drawn as dashed boxes, a linear layer and a ReLU. Along the top, values flow left to right: X enters the linear layer, which computes Y = X W + b; Y enters the ReLU, which computes H = max(0, Y). Along the bottom, gradients flow right to left: dH enters the ReLU, which passes it on as dY wherever H is positive; dY enters the linear layer, which computes dX = dY times W transposed for the layer before it, and adds X transposed times dY to the weight gradient and the column sums of dY to the bias gradient.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="rgba(25,22,21,.09)"/>
    </pattern>
    <marker id="fwd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.5,0.5 L7.5,4 L0.5,7.5 Z" fill="#047857"/>
    </marker>
    <marker id="bwd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.5,0.5 L7.5,4 L0.5,7.5 Z" fill="#B45309"/>
    </marker>
    <marker id="ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0.5,0.5 L7.5,4 L0.5,7.5 Z" fill="rgba(25,22,21,.48)"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F5F3EF"/>
  <rect x="0" y="48" width="800" height="340" fill="url(#dots)"/>

  <text x="24" y="30" font-size="15.5" font-weight="500" fill="#191615">Values flow right, gradients flow left</text>

  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em">
    <text x="24" y="92" fill="#047857">FORWARD</text>
    <text x="24" y="296" fill="#B45309">BACKWARD</text>
  </g>

  <!-- layer group boxes -->
  <g fill="none" stroke="rgba(25,22,21,.30)" stroke-width="1" stroke-dasharray="3 3">
    <rect x="150" y="62" width="300" height="316" rx="10"/>
    <rect x="516" y="62" width="184" height="316" rx="10"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)">
    <text x="164" y="80">LINEAR LAYER</text>
    <text x="530" y="80">RELU</text>
  </g>

  <!-- forward lane (y = 120) -->
  <g stroke="#047857" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="92" y1="120" x2="198" y2="120" marker-end="url(#fwd)"/>
    <line x1="400" y1="120" x2="545" y2="120" marker-end="url(#fwd)"/>
    <line x1="669" y1="120" x2="776" y2="120" marker-end="url(#fwd)"/>
  </g>
  <g fill="#FBFAF7" stroke="rgba(25,22,21,.15)" stroke-width="1">
    <rect x="200" y="100" width="200" height="40" rx="8"/>
    <rect x="547" y="100" width="122" height="40" rx="8"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#191615" text-anchor="middle">
    <text x="300" y="125">Y = X W + b</text>
    <text x="608" y="125">H = max(0, Y)</text>
  </g>

  <!-- backward lane (y = 320) -->
  <g stroke="#B45309" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="776" y1="320" x2="694" y2="320" marker-end="url(#bwd)"/>
    <line x1="522" y1="320" x2="402" y2="320" marker-end="url(#bwd)"/>
    <line x1="198" y1="320" x2="92" y2="320" marker-end="url(#bwd)"/>
  </g>
  <g fill="#FBFAF7" stroke="rgba(25,22,21,.15)" stroke-width="1">
    <rect x="200" y="300" width="200" height="40" rx="8"/>
    <rect x="524" y="290" width="168" height="60" rx="8"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#191615" text-anchor="middle">
    <text x="300" y="325">dX = dY Wᵀ</text>
    <text x="608" y="315">dY = dH where H &gt; 0</text>
    <text x="608" y="335">0 elsewhere</text>
  </g>

  <!-- signal labels as pills -->
  <g fill="#F5F3EF" stroke="rgba(25,22,21,.15)" stroke-width="1">
    <rect x="48" y="108" width="44" height="24" rx="8"/>
    <rect x="461" y="108" width="44" height="24" rx="8"/>
    <rect x="714" y="108" width="44" height="24" rx="8"/>
    <rect x="48" y="308" width="44" height="24" rx="8"/>
    <rect x="461" y="308" width="44" height="24" rx="8"/>
    <rect x="714" y="308" width="44" height="24" rx="8"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="70" y="124" fill="#047857">X</text>
    <text x="483" y="124" fill="#047857">Y</text>
    <text x="736" y="124" fill="#047857">H</text>
    <text x="70" y="324" fill="#B45309">dX</text>
    <text x="483" y="324" fill="#B45309">dY</text>
    <text x="736" y="324" fill="#B45309">dH</text>
  </g>

  <!-- the weight gradients, in the middle of the linear layer -->
  <rect x="200" y="176" width="200" height="88" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
  <text x="214" y="195" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)">ADDED INTO GRADS</text>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#B45309">
    <text x="214" y="220">dW += Xᵀ dY</text>
    <text x="214" y="246">db += column sums of dY</text>
  </g>
  <!-- dY feeds the weight gradients -->
  <path d="M430,320 L430,220 L402,220" fill="none" stroke="#B45309" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bwd)"/>
  <!-- the cache: X remembered from the forward pass -->
  <path d="M172,120 L172,220 L198,220" fill="none" stroke="rgba(25,22,21,.48)" stroke-width="1.1" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ink)"/>
  <text x="166" y="170" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)" text-anchor="middle" transform="rotate(-90 166 170)">CACHE: X</text>

  <!-- ReLU middle note -->
  <path d="M608,140 L608,288" fill="none" stroke="rgba(25,22,21,.48)" stroke-width="1.1" stroke-dasharray="3 3" stroke-linecap="round" marker-end="url(#ink)"/>
  <rect x="554" y="200" width="108" height="26" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
  <text x="608" y="217" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)" text-anchor="middle">CACHE: H</text>

  <!-- edge captions -->
  <g font-size="12" fill="rgba(25,22,21,.70)">
    <text x="24" y="150">previous layer</text>
    <text x="776" y="150" text-anchor="end">next layer</text>
    <text x="24" y="352">previous layer</text>
    <text x="776" y="352" text-anchor="end">next layer</text>
  </g>

  <text x="24" y="412" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)">D-SOMETHING = HOW MUCH THE LOSS CHANGES WHEN THAT SOMETHING CHANGES · SAME SHAPE AS THE SOMETHING</text>
</svg>
