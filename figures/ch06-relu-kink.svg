<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Why a ReLU can fool the gradient checker</title>
  <desc>Two plots of the ReLU function near zero, with a weight sitting at 0.004. Left: nudging by 0.01 puts one probe at minus 0.006, where the output is 0, and one at 0.014. The line through the two probes has slope 0.7 although the true slope at the weight is 1. Right: nudging by 0.001 keeps both probes on the sloped side, and the measured slope is 1.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="rgba(25,22,21,.09)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#F5F3EF"/>

  <text x="24" y="30" font-size="15.5" font-weight="500" fill="#191615">A nudge that straddles the kink measures a slope that is not there</text>

  <!-- ============ left panel: eps = 0.01 ============ -->
  <rect x="40" y="58" width="340" height="212" rx="10" fill="url(#dots)" stroke="rgba(25,22,21,.30)" stroke-dasharray="3 3"/>
  <text x="54" y="76" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)">EPS = 0.01</text>
  <!-- axis -->
  <line x1="60" y1="250" x2="360" y2="250" stroke="rgba(25,22,21,.30)" stroke-width="1"/>
  <!-- ReLU -->
  <polyline points="60,250 168,250 348,70" fill="none" stroke="#191615" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chord between the probes -->
  <line x1="114" y1="250" x2="294" y2="124" stroke="#B45309" stroke-width="1.75" stroke-dasharray="5 4" stroke-linecap="round"/>
  <!-- drop lines -->
  <g stroke="rgba(25,22,21,.30)" stroke-width="1" stroke-dasharray="2 3">
    <line x1="204" y1="214" x2="204" y2="250"/>
    <line x1="294" y1="124" x2="294" y2="250"/>
  </g>
  <circle cx="114" cy="250" r="4" fill="#B45309"/>
  <circle cx="294" cy="124" r="4" fill="#B45309"/>
  <circle cx="204" cy="214" r="4" fill="#047857"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="rgba(25,22,21,.60)" text-anchor="middle">
    <text x="114" y="265">−0.006</text>
    <text x="168" y="265">0</text>
    <text x="207" y="265">0.004</text>
    <text x="294" y="265">0.014</text>
  </g>
  <g font-size="12">
    <text x="60" y="104" fill="#B45309">measured: 0.014 / 0.02 = 0.7</text>
    <text x="60" y="122" fill="#047857">true slope at 0.004: 1</text>
  </g>

  <!-- ============ right panel: eps = 0.001 ============ -->
  <rect x="420" y="58" width="340" height="212" rx="10" fill="url(#dots)" stroke="rgba(25,22,21,.30)" stroke-dasharray="3 3"/>
  <text x="434" y="76" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)">EPS = 0.001</text>
  <line x1="440" y1="250" x2="740" y2="250" stroke="rgba(25,22,21,.30)" stroke-width="1"/>
  <polyline points="440,250 548,250 728,70" fill="none" stroke="#191615" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="575" y1="223" x2="593" y2="205" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <line x1="584" y1="214" x2="584" y2="250" stroke="rgba(25,22,21,.30)" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="575" cy="223" r="3.5" fill="#B45309"/>
  <circle cx="593" cy="205" r="3.5" fill="#B45309"/>
  <circle cx="584" cy="214" r="3" fill="#047857"/>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="rgba(25,22,21,.60)" text-anchor="middle">
    <text x="548" y="265">0</text>
    <text x="587" y="265">0.004</text>
  </g>
  <g font-size="12">
    <text x="440" y="104" fill="#B45309">measured: 0.002 / 0.002 = 1</text>
    <text x="440" y="122" fill="#047857">true slope at 0.004: 1</text>
  </g>

  <!-- shared axis labels -->
  <g font-size="12" fill="rgba(25,22,21,.70)" text-anchor="middle">
    <text x="210" y="290">input to the ReLU</text>
    <text x="590" y="290">input to the ReLU</text>
  </g>
  <text x="24" y="322" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.60)">BLACK: MAX(0, X) · GREEN: WHERE THE WEIGHT IS · AMBER: THE TWO NUDGED PROBES AND THE LINE THROUGH THEM</text>
</svg>
