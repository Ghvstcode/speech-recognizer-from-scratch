<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img">
<rect width="100%" height="100%" fill="#F5F3EF"/>
<title>The log-mel pipeline, stage by stage, with the shape of the data after each stage</title>
<desc>Eight boxes joined by arrows. Samples: 16000 numbers. Pre-emphasis: 16000. Frames of 25 milliseconds every 10 milliseconds: 98 rows of 400. Hann window: 98 by 400. FFT, zero-padded to 512: 98 by 512 complex numbers. Power, bins 0 to 256: 98 by 257. Mel filterbank of 40 triangles: 98 by 40. Logarithm: 98 by 40, the log-mel spectrogram. An optional ninth box, the DCT keeping 13 coefficients, turns that into 98 by 13 MFCCs.</desc>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.5" fill="rgba(25,22,21,0.1)"/></pattern></defs>
<rect x="0" y="44" width="800" height="432" fill="url(#dots)"/>
<text x="24" y="30" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#191615">From one second of sound to a 98 × 40 picture</text>
