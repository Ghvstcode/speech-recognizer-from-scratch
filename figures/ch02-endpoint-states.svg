<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
<rect width="100%" height="100%" fill="#F5F3EF"/>
<title>The endpoint detector as a two-state machine</title>
<desc>Two states, silence and speech. The detector moves from silence to speech after 30 milliseconds of loud blocks in a row and reports a speech start. It moves back after 200 milliseconds of quiet blocks in a row and reports a speech end. A scale underneath shows the two thresholds: a block must be 10 decibels above the noise floor to start speech, but only 5 decibels above it to keep speech going.</desc>
<defs>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.6" fill="rgba(25,22,21,.10)"/></pattern>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#191615" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="44" width="800" height="356" fill="url(#dots)"/>
<text x="24" y="30" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#191615">The endpoint detector as a two-state machine</text>

<!-- SILENCE card -->
<rect x="40" y="76" width="230" height="150" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,.30)" stroke-width="1"/>
<text x="58" y="100" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.48)">STATE</text>
<text x="58" y="124" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#191615">Silence</text>
<line x1="58" y1="138" x2="252" y2="138" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
<text x="58" y="160" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">quiet block: reset the loud run,</text>
<text x="58" y="177" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">update the noise floor</text>
<text x="58" y="202" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">loud block: count it</text>

<!-- SPEECH card -->
<rect x="530" y="76" width="230" height="150" rx="8" fill="#FBFAF7" stroke="#047857" stroke-width="1.25"/>
<text x="548" y="100" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.48)">STATE</text>
<text x="548" y="124" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#047857">Speech</text>
<line x1="548" y1="138" x2="742" y2="138" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
<text x="548" y="160" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">loud block: reset the quiet run</text>
<text x="548" y="185" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">quiet block: count it,</text>
<text x="548" y="202" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">the noise floor stays frozen</text>

<!-- silence -> speech -->
<line x1="274" y1="116" x2="525" y2="116" stroke="#191615" stroke-width="1.25" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="322" y="105" width="156" height="22" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
<text x="400" y="120" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="#191615">30 MS LOUD IN A ROW</text>
<text x="400" y="96" text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#047857">reports SpeechStart</text>

<!-- speech -> silence -->
<line x1="526" y1="186" x2="275" y2="186" stroke="#191615" stroke-width="1.25" stroke-linecap="round" marker-end="url(#head)"/>
<rect x="316" y="175" width="168" height="22" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
<text x="400" y="190" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="#191615">200 MS QUIET IN A ROW</text>
<text x="400" y="216" text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#B45309">reports SpeechEnd</text>

<!-- threshold scale -->
<rect x="40" y="258" width="720" height="118" rx="10" fill="none" stroke="rgba(25,22,21,.30)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="58" y="281" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.48)">WHAT COUNTS AS LOUD: BLOCK LEVEL ABOVE THE NOISE FLOOR (DB)</text>
<line x1="90" y1="322" x2="710" y2="322" stroke="rgba(25,22,21,.30)" stroke-width="1.25" stroke-linecap="round"/>
<line x1="330" y1="322" x2="710" y2="322" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
<line x1="490" y1="328" x2="710" y2="328" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="314" x2="170" y2="330" stroke="#191615" stroke-width="1.25" stroke-linecap="round"/>
<line x1="330" y1="314" x2="330" y2="330" stroke="#191615" stroke-width="1.25" stroke-linecap="round"/>
<line x1="490" y1="314" x2="490" y2="334" stroke="#191615" stroke-width="1.25" stroke-linecap="round"/>
<text x="170" y="350" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,.48)">0</text>
<text x="330" y="350" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,.48)">+5</text>
<text x="490" y="350" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,.48)">+10</text>
<text x="170" y="306" text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(25,22,21,.70)">noise floor</text>
<text x="410" y="306" text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#B45309">enough to stay in speech</text>
<text x="600" y="306" text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#047857">needed to start speech</text>
<text x="742" y="366" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,.48)">louder →</text>
</svg>
