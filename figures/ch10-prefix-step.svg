<svg xmlns="http://www.w3.org/2000/svg" width="800" height="436" viewBox="0 0 800 436" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>One step of prefix beam search</title>
<desc>The prefix a, after two frames of the toy table, carries two probabilities: 0.20 for alignments that end in a blank and 0.36 for alignments that end in the letter a. The third frame gives the blank 0.3, a 0.1 and b 0.6. Four arrows leave the prefix. A blank keeps the prefix a and adds (0.20 + 0.36) times 0.3 = 0.168 to its ends-in-blank probability. The letter a again, with no blank in between, keeps the prefix a and adds 0.36 times 0.1 = 0.036 to its ends-in-label probability. The letter b grows the prefix to ab and adds (0.20 + 0.36) times 0.6 = 0.336. The letter a after a blank grows the prefix to aa and adds only 0.20 times 0.1 = 0.020, because only the alignments that ended in a blank can start a second a.</desc>
<rect width="100%" height="100%" fill="#F5F3EF"/>
<defs>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(25,22,21,0.08)"/></pattern>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.5,0.8 L7,4 L0.5,7.2 Z" fill="rgb(140,137,134)"/></marker>
</defs>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="40" y="36" font-size="16" font-weight="500" fill="#191615">One prefix, one frame, four things that can happen</text>
<text x="40" y="56" font-size="12.5" fill="rgba(25,22,21,0.7)">The prefix "a" from the toy table meets frame 2. Which of its two probabilities is used depends on the move.</text>

<!-- the prefix card -->
<rect x="40" y="96" width="210" height="150" rx="8" fill="#FBFAF7" stroke="#191615" stroke-width="1.25"/>
<text x="58" y="120" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">PREFIX AFTER FRAME 1</text>
<text x="58" y="162" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="500" fill="#191615">a</text>
<line x1="58" y1="178" x2="232" y2="178" stroke="rgba(25,22,21,0.15)"/>
<g font-size="12.5" fill="rgba(25,22,21,0.7)">
<text x="58" y="202">ends in a blank</text>
<text x="58" y="228">ends in the letter a</text>
</g>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" text-anchor="end">
<text x="232" y="202" fill="#B45309">0.20</text>
<text x="232" y="228" fill="#047857">0.36</text>
</g>

<!-- the frame card -->
<rect x="40" y="282" width="210" height="96" rx="10" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)" stroke-dasharray="3 3"/>
<text x="58" y="306" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">FRAME 2 SAYS</text>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#191615">
<text x="58" y="332">y[_] = 0.3</text>
<text x="58" y="352">y[a] = 0.1</text>
<text x="154" y="332">y[b] = 0.6</text>
</g>

<!-- arrows -->
<g stroke="rgb(140,137,134)" stroke-width="1.25" stroke-linecap="round" fill="none">
<line x1="254" y1="150" x2="474" y2="117" marker-end="url(#ah)"/>
<line x1="254" y1="164" x2="474" y2="193" marker-end="url(#ah)"/>
<line x1="254" y1="178" x2="474" y2="269" marker-end="url(#ah)"/>
<line x1="254" y1="192" x2="474" y2="345" marker-end="url(#ah)"/>
</g>
<!-- pills on the arrows -->
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" text-anchor="middle">
<rect x="383" y="116" width="74" height="18" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,0.15)"/>
<text x="420" y="129" fill="#191615">blank</text>
<rect x="383" y="177" width="74" height="18" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,0.15)"/>
<text x="420" y="190" fill="#191615">a again</text>
<rect x="383" y="238" width="74" height="18" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,0.15)"/>
<text x="420" y="251" fill="#191615">b</text>
<rect x="377" y="298" width="86" height="18" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,0.15)"/>
<text x="420" y="311" fill="#191615">a, new run</text>
</g>

<!-- outcome cards -->
<g>
<rect x="480" y="84" width="280" height="66" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)"/>
<rect x="480" y="160" width="280" height="66" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)"/>
<rect x="480" y="236" width="280" height="66" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)"/>
<rect x="480" y="312" width="280" height="66" rx="8" fill="#FBFAF7" stroke="#B45309" stroke-width="1.25"/>
</g>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">
<text x="496" y="105">CASE 1 · STAYS "a", ENDS IN BLANK</text>
<text x="496" y="181">CASE 2 · STAYS "a", ENDS IN a</text>
<text x="496" y="257">CASE 3 · GROWS TO "ab"</text>
<text x="496" y="333" fill="#B45309">CASE 3, SAME LETTER · GROWS TO "aa"</text>
</g>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#191615">
<text x="496" y="133">(<tspan fill="#B45309">0.20</tspan> + <tspan fill="#047857">0.36</tspan>) × 0.3 = 0.168</text>
<text x="496" y="209"><tspan fill="#047857">0.36</tspan> × 0.1 = 0.036</text>
<text x="496" y="285">(<tspan fill="#B45309">0.20</tspan> + <tspan fill="#047857">0.36</tspan>) × 0.6 = 0.336</text>
<text x="496" y="361"><tspan fill="#B45309">0.20</tspan> × 0.1 = 0.020</text>
</g>
<text x="480" y="400" font-size="12" fill="rgba(25,22,21,0.7)">Only the alignments that ended in a blank</text>
<text x="480" y="417" font-size="12" fill="rgba(25,22,21,0.7)">can start a second a.</text>
</svg>
