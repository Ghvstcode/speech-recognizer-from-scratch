<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>One attention head, for one query</title>
  <desc>A query row is compared with five key rows by dot product, giving the scores 0.2, 1.1, 3.0, 0.9 and minus 0.5. Softmax turns the scores into the weights 0.04, 0.11, 0.73, 0.09 and 0.02. The output row is the weighted average of the five value rows, so it is mostly a copy of value row 2.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="rgba(25,22,21,.09)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#191615"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F5F3EF"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- column overlines -->
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,.70)">
    <text x="32" y="40">QUERY</text>
    <text x="190" y="40">KEYS</text>
    <text x="306" y="40">SCORE = Q · K / √64</text>
    <text x="456" y="40">SOFTMAX → WEIGHT</text>
    <text x="606" y="40">VALUES</text>
    <text x="712" y="40">OUTPUT</text>
  </g>

  <!-- query -->
  <rect x="32" y="166" width="104" height="34" rx="8" fill="#FBFAF7" stroke="#191615" stroke-width="1.1"/>
  <text x="84" y="188" text-anchor="middle" font-size="13" fill="#191615">q</text>
  <text x="84" y="220" text-anchor="middle" font-size="11" fill="rgba(25,22,21,.48)">the row that asks</text>

  <!-- fan from query to keys -->
  <g stroke="rgba(25,22,21,.30)" stroke-width="1" fill="none">
    <path d="M136 183 L188 81"/>
    <path d="M136 183 L188 132"/>
    <path d="M136 183 L188 183"/>
    <path d="M136 183 L188 234"/>
    <path d="M136 183 L188 285"/>
  </g>

  <!-- keys -->
  <g fill="#FBFAF7" stroke="rgba(25,22,21,.15)">
    <rect x="190" y="64" width="84" height="34" rx="8"/>
    <rect x="190" y="115" width="84" height="34" rx="8"/>
    <rect x="190" y="166" width="84" height="34" rx="8"/>
    <rect x="190" y="217" width="84" height="34" rx="8"/>
    <rect x="190" y="268" width="84" height="34" rx="8"/>
  </g>
  <g font-size="13" fill="#191615" text-anchor="middle">
    <text x="232" y="86">k₀</text>
    <text x="232" y="137">k₁</text>
    <text x="232" y="188">k₂</text>
    <text x="232" y="239">k₃</text>
    <text x="232" y="290">k₄</text>
  </g>

  <!-- scores -->
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#191615" text-anchor="end">
    <text x="372" y="86">0.2</text>
    <text x="372" y="137">1.1</text>
    <text x="372" y="188" fill="#047857" font-weight="600">3.0</text>
    <text x="372" y="239">0.9</text>
    <text x="372" y="290">−0.5</text>
  </g>
  <g stroke="rgba(25,22,21,.30)" stroke-width="1">
    <path d="M278 81 H334"/><path d="M278 132 H334"/><path d="M278 183 H334"/><path d="M278 234 H334"/><path d="M278 285 H334"/>
    <path d="M384 81 H450"/><path d="M384 132 H450"/><path d="M384 183 H450"/><path d="M384 234 H450"/><path d="M384 285 H450"/>
  </g>

  <!-- weights as bars: full width 100 = weight 1 -->
  <g>
    <rect x="456" y="71" width="100" height="20" rx="3" fill="rgba(25,22,21,.07)"/>
    <rect x="456" y="122" width="100" height="20" rx="3" fill="rgba(25,22,21,.07)"/>
    <rect x="456" y="173" width="100" height="20" rx="3" fill="rgba(25,22,21,.07)"/>
    <rect x="456" y="224" width="100" height="20" rx="3" fill="rgba(25,22,21,.07)"/>
    <rect x="456" y="275" width="100" height="20" rx="3" fill="rgba(25,22,21,.07)"/>
    <rect x="456" y="71" width="4.5" height="20" rx="2" fill="#9FB8A9"/>
    <rect x="456" y="122" width="11" height="20" rx="3" fill="#9FB8A9"/>
    <rect x="456" y="173" width="73.4" height="20" rx="3" fill="#047857"/>
    <rect x="456" y="224" width="9" height="20" rx="3" fill="#9FB8A9"/>
    <rect x="456" y="275" width="2.2" height="20" rx="1" fill="#9FB8A9"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,.70)">
    <text x="562" y="85">.04</text>
    <text x="562" y="136">.11</text>
    <text x="562" y="187" fill="#047857" font-weight="600">.73</text>
    <text x="562" y="238">.09</text>
    <text x="562" y="289">.02</text>
  </g>

  <!-- values -->
  <g fill="#FBFAF7" stroke="rgba(25,22,21,.15)">
    <rect x="606" y="64" width="64" height="34" rx="8"/>
    <rect x="606" y="115" width="64" height="34" rx="8"/>
    <rect x="606" y="217" width="64" height="34" rx="8"/>
    <rect x="606" y="268" width="64" height="34" rx="8"/>
  </g>
  <rect x="606" y="166" width="64" height="34" rx="8" fill="#FBFAF7" stroke="#047857" stroke-width="1.25"/>
  <g font-size="13" fill="#191615" text-anchor="middle">
    <text x="638" y="86">v₀</text>
    <text x="638" y="137">v₁</text>
    <text x="638" y="188" fill="#047857">v₂</text>
    <text x="638" y="239">v₃</text>
    <text x="638" y="290">v₄</text>
  </g>

  <!-- gather into output -->
  <g stroke="rgba(25,22,21,.30)" stroke-width="1" fill="none">
    <path d="M670 81 L710 176"/>
    <path d="M670 132 L710 180"/>
    <path d="M670 234 L710 186"/>
    <path d="M670 285 L710 190"/>
  </g>
  <path d="M670 183 H708" stroke="#047857" stroke-width="1.75" fill="none"/>
  <rect x="712" y="166" width="62" height="34" rx="8" fill="#FBFAF7" stroke="#191615" stroke-width="1.1"/>
  <text x="743" y="188" text-anchor="middle" font-size="13" fill="#191615">Σ w · v</text>
  <text x="743" y="220" text-anchor="middle" font-size="11" fill="rgba(25,22,21,.48)">mostly v₂</text>

  <!-- footer -->
  <path d="M32 334 H774" stroke="rgba(25,22,21,.15)" stroke-width="1"/>
  <text x="32" y="358" font-size="12" fill="rgba(25,22,21,.70)">Keys say what each source row is about, values say what it has to offer. The query picks by similarity.</text>
  <text x="32" y="378" font-size="12" fill="rgba(25,22,21,.70)">Whisper tiny runs six of these heads side by side, each on its own 64 of the 384 columns.</text>
</svg>
