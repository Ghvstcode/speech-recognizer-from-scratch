<text x="394" y="308" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">2</text>
<text x="458" y="308" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<text x="202" y="358" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">4</text>
<text x="266" y="358" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<text x="330" y="358" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<circle cx="394" cy="353" r="14" fill="#FBFAF7" stroke="#047857" stroke-width="1.5"/>
<text x="394" y="358" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">2</text>
<circle cx="458" cy="353" r="14" fill="#FBFAF7" stroke="#047857" stroke-width="1.5"/>
<text x="458" y="358" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">3</text>
<text x="490" y="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="#047857" text-anchor="end">EDIT DISTANCE = 3</text>
<rect x="530" y="96" width="238" height="150" rx="10" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)" stroke-dasharray="3 3"/>
<text x="548" y="120" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">THREE WAYS INTO A CELL</text>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#191615">
<text x="548" y="146">d[i][j] = min of</text>
<text x="560" y="170">d[i-1][j-1] + 0 or 1</text>
<text x="560" y="192">d[i-1][j]   + 1</text>
<text x="560" y="214">d[i][j-1]   + 1</text>
</g>
<text x="548" y="234" font-size="11.5" fill="rgba(25,22,21,0.7)">0 if the two words are equal</text>
<rect x="530" y="262" width="238" height="146" rx="10" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)" stroke-dasharray="3 3"/>
<text x="548" y="286" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">READING THE GREEN PATH</text>
<g font-size="12">
<text x="548" y="310" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,0.48)">diagonal</text>
<text x="622" y="310" fill="#191615">turn = turn</text>
<text x="750" y="310" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#047857" text-anchor="end">+0</text>
<text x="548" y="330" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,0.48)">down</text>
<text x="622" y="330" fill="#191615">delete the</text>
<text x="750" y="330" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#B45309" text-anchor="end">+1</text>
<text x="548" y="350" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,0.48)">diagonal</text>
<text x="622" y="350" fill="#191615">lights → light</text>
<text x="750" y="350" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#B45309" text-anchor="end">+1</text>
<text x="548" y="370" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,0.48)">diagonal</text>
<text x="622" y="370" fill="#191615">off = off</text>
<text x="750" y="370" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#047857" text-anchor="end">+0</text>
<text x="548" y="390" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="rgba(25,22,21,0.48)">right</text>
<text x="622" y="390" fill="#191615">insert now</text>
<text x="750" y="390" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#B45309" text-anchor="end">+1</text>
</g>
</svg>
