<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>The edit-distance grid for two short sentences</title>
<desc>A five by five grid. Rows are the reference words turn, the, lights, off, preceded by an empty start row; columns are the hypothesis words turn, light, off, now, preceded by an empty start column. Each cell holds the smallest number of edits that turns the reference words so far into the hypothesis words so far. The top row counts 0 to 4 and so does the left column. The bottom-right cell holds 3, the edit distance. A highlighted path runs from the top-left to the bottom-right: a diagonal step for the match turn, a step down that deletes the, a diagonal step that substitutes light for lights, a diagonal step for the match off, and a step right that inserts now.</desc>
<rect width="100%" height="100%" fill="#F5F3EF"/>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(25,22,21,0.08)"/></pattern></defs>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="40" y="36" font-size="16" font-weight="500" fill="#191615">Edit distance is a cheapest path through a grid</text>
<text x="40" y="56" font-size="12.5" fill="rgba(25,22,21,0.7)">Each cell: the fewest edits that turn the reference words so far into the hypothesis words so far.</text>
<text x="330.0" y="88" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)" text-anchor="middle">HYPOTHESIS (WHAT WE HEARD)</text>
<text x="52" y="253.0" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)" text-anchor="middle" transform="rotate(-90 52 253.0)">REFERENCE (WHAT WAS SAID)</text>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#191615" text-anchor="middle">
<text x="202" y="116" fill="rgba(25,22,21,0.48)">(start)</text>
<text x="266" y="116">turn</text>
<text x="330" y="116">light</text>
<text x="394" y="116">off</text>
<text x="458" y="116">now</text>
</g>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#191615" text-anchor="end">
<text x="158" y="157" fill="rgba(25,22,21,0.48)">(start)</text>
<text x="158" y="207">turn</text>
<text x="158" y="257">the</text>
<text x="158" y="307">lights</text>
<text x="158" y="357">off</text>
</g>
<rect x="170" y="128" width="320" height="250" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)"/>
<g stroke="rgba(25,22,21,0.15)">
<line x1="234" y1="128" x2="234" y2="378"/>
