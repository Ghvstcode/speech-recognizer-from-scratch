<text x="266" y="208" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">0</text>
<text x="330" y="208" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">1</text>
<text x="394" y="208" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">2</text>
<text x="458" y="208" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<text x="202" y="258" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">2</text>
<circle cx="266" cy="253" r="14" fill="#FBFAF7" stroke="#047857" stroke-width="1.5"/>
<text x="266" y="258" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">1</text>
<text x="330" y="258" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">1</text>
<text x="394" y="258" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">2</text>
<text x="458" y="258" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<text x="202" y="308" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<text x="266" y="308" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">2</text>
