<line x1="426" y1="128" x2="426" y2="378"/>
<line x1="170" y1="328" x2="490" y2="328"/>
</g>
<polyline points="202,153 266,203 266,253 330,303 394,353 458,353" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="202" cy="153" r="14" fill="#FBFAF7" stroke="#047857" stroke-width="1.5"/>
<text x="202" y="158" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">0</text>
<text x="266" y="158" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">1</text>
<text x="330" y="158" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">2</text>
<text x="394" y="158" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">3</text>
<text x="458" y="158" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">4</text>
<text x="202" y="208" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="rgba(25,22,21,0.7)" text-anchor="middle">1</text>
