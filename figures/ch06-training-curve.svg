<svg xmlns="http://www.w3.org/2000/svg" width="800" height="498" viewBox="0 0 800 498" role="img">
<rect width="100%" height="100%" fill="#F5F3EF"/>
<title>Training the digit network: it learns the training speakers perfectly, strangers less well</title>
<desc>Two line plots against the training epoch. Top: the cross-entropy loss falls towards zero on the training clips and on test clips of the same speakers, but on unseen speakers it stops falling early and stays far higher. Bottom: accuracy reaches 100 percent on training clips and nearly that on test clips of known speakers, and levels off near 80 percent on unseen speakers.</desc>
<text x="24" y="30" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#191615">Training the digit network: it learns the training speakers perfectly, strangers less well</text>
