<line x1="416" y1="316" x2="542" y2="316" stroke="rgba(25,22,21,0.1)" stroke-width="1"/>
<text x="416" y="334" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">lexicon beam search</text>
<text x="416" y="349" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">over 35 words</text>
<text x="416" y="367" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,0.48)">ch 10</text>
