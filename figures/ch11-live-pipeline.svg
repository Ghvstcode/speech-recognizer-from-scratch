<text x="392" y="168" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" fill="rgba(25,22,21,0.48)">32,000 bytes/s</text>
<text x="392" y="116" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" fill="rgba(25,22,21,0.48)">raw samples</text>
<path d="M694 187 L694 228 L111 228 L111 278" fill="none" stroke="rgba(25,22,21,0.48)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M107 277 L111 284 L115 277 Z" fill="rgba(25,22,21,0.48)"/>
<rect x="270" y="217" width="260" height="22" rx="8" fill="#F5F3EF" stroke="rgba(25,22,21,0.15)" stroke-width="1"/>
<text x="400" y="232" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle" fill="rgba(25,22,21,0.7)">one Segment: up to 10 s of samples</text>
<rect x="24" y="254" width="752" height="140" rx="10" fill="none" stroke="rgba(25,22,21,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="762" y="273" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" text-anchor="end" fill="rgba(25,22,21,0.48)">ONCE PER UTTERANCE · RECOGNIZER, SRC/DATA/PIPELINE.RS</text>
<rect x="40" y="286" width="150" height="92" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)" stroke-width="1"/>
<text x="52" y="307" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.7)">FEATURES</text>
<line x1="52" y1="316" x2="178" y2="316" stroke="rgba(25,22,21,0.1)" stroke-width="1"/>
<text x="52" y="334" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">40 log-mel bands,</text>
<text x="52" y="349" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">normalized</text>
