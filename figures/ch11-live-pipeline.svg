<line x1="598" y1="316" x2="748" y2="316" stroke="rgba(25,22,21,0.1)" stroke-width="1"/>
<text x="598" y="334" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">[ 0.63 s - 2.78 s]</text>
<text x="598" y="349" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">five cat up</text>
<text x="598" y="367" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,0.48)">one line on stdout</text>
