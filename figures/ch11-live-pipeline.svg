<line x1="640" y1="122" x2="748" y2="122" stroke="rgba(25,22,21,0.1)" stroke-width="1"/>
<text x="640" y="140" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">10 ms blocks into</text>
<text x="640" y="155" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">the Endpointer</text>
<text x="640" y="173" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,0.48)">utterances out</text>
<line x1="306" y1="138" x2="471" y2="138" stroke="#047857" stroke-width="1.75" stroke-linecap="round"/>
