<svg xmlns="http://www.w3.org/2000/svg" width="800" height="452" viewBox="0 0 800 452" role="img">
<rect width="100%" height="100%" fill="#F5F3EF"/>
<title>The live pipeline: from the microphone to text</title>
<desc>Top row: a microphone feeds a child ffmpeg process, which writes raw 16-bit samples at 16 kHz into a pipe, 32,000 bytes per second. Inside our program the PcmDecoder turns the bytes into samples and the Segmenter cuts the endless stream into utterances. Bottom row, run once per finished utterance: normalized log-mel features, the network, the decoder, and the printed text. A note says that a WAV file or standard input can stand in for the microphone and ffmpeg.</desc>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.5" fill="rgba(25,22,21,0.1)"/></pattern></defs>
<rect x="0" y="44" width="800" height="408" fill="url(#dots)"/>
<text x="24" y="30" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#191615">Listening live: an endless stream in, one line of text per utterance out</text>
<rect x="24" y="60" width="296" height="140" rx="10" fill="none" stroke="rgba(25,22,21,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="38" y="79" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">ANOTHER PROCESS</text>
<rect x="40" y="92" width="124" height="92" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)" stroke-width="1"/>
<text x="52" y="113" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.7)">MICROPHONE</text>
<line x1="52" y1="122" x2="152" y2="122" stroke="rgba(25,22,21,0.1)" stroke-width="1"/>
<text x="52" y="140" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">sound, through</text>
<text x="52" y="155" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">the OS audio driver</text>
<text x="52" y="173" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,0.48)">any rate</text>
<line x1="166" y1="138" x2="169" y2="138" stroke="rgba(25,22,21,0.48)" stroke-width="1.25" stroke-linecap="round"/>
<path d="M168 134 L175 138 L168 142 Z" fill="rgba(25,22,21,0.48)"/>
<rect x="180" y="92" width="124" height="92" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)" stroke-width="1"/>
<text x="192" y="113" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.7)">FFMPEG</text>
<line x1="192" y1="122" x2="292" y2="122" stroke="rgba(25,22,21,0.1)" stroke-width="1"/>
<text x="192" y="140" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">resample to 16 kHz,</text>
<text x="192" y="155" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="rgba(25,22,21,0.7)">mono, 16-bit</text>
<text x="192" y="173" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,0.48)">-f s16le -</text>
<rect x="464" y="60" width="312" height="140" rx="10" fill="none" stroke="rgba(25,22,21,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="478" y="79" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">OUR PROGRAM · SRC/MIC.RS</text>
<rect x="480" y="92" width="132" height="92" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.15)" stroke-width="1"/>
