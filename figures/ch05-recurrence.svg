<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>The DTW recurrence on one cell</title>
<desc>Four neighboring cells of the accumulated-cost grid from the toy example. The cell for frame 2 of a and frame 3 of b can be reached from three cells: diagonally from the cell holding 0, from above from the cell holding 4, and from the left from the cell holding 3. Its own local distance is 1, so its accumulated cost is 1 plus the smallest of 0, 4 and 3, which is 1. The diagonal arrow, the one that won, is highlighted.</desc>
<rect width="100%" height="100%" fill="#F5F3EF"/>
<defs>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(25,22,21,0.08)"/></pattern>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.5,0.8 L7,4 L0.5,7.2 Z" fill="rgb(140,137,134)"/></marker>
<marker id="ahG" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.5,0.8 L7,4 L0.5,7.2 Z" fill="#047857"/></marker>
</defs>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="40" y="36" font-size="16" font-weight="500" fill="#191615">One cell, three ways in</text>
<text x="40" y="56" font-size="12.5" fill="rgba(25,22,21,0.7)">The best path to a cell is the best path to one of three neighbors, plus one more step.</text>

<!-- column labels -->
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)" text-anchor="middle">
<text x="180" y="98">B[2] = 1</text>
<text x="356" y="98">B[3] = 5</text>
</g>
<!-- row labels -->
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)" text-anchor="end">
<text x="106" y="154">A[1] = 1</text>
<text x="106" y="290">A[2] = 4</text>
</g>

<!-- cells -->
<g>
<rect x="120" y="110" width="120" height="80" rx="8" fill="#FBFAF7" stroke="#047857" stroke-width="1.25"/>
<rect x="296" y="110" width="120" height="80" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)" stroke-width="1"/>
<rect x="120" y="246" width="120" height="80" rx="8" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)" stroke-width="1"/>
<rect x="296" y="246" width="120" height="80" rx="8" fill="#FBFAF7" stroke="#191615" stroke-width="1.5"/>
</g>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" text-anchor="middle">
<text x="180" y="130" fill="#047857" letter-spacing=".02em">D(1,2) · DIAGONAL</text>
<text x="356" y="130" fill="rgba(25,22,21,0.48)">D(1,3) · UP</text>
<text x="180" y="266" fill="rgba(25,22,21,0.48)">D(2,2) · LEFT</text>
<text x="356" y="266" fill="rgba(25,22,21,0.7)">D(2,3)</text>
</g>
<g font-size="30" font-weight="500" text-anchor="middle">
<text x="180" y="172" fill="#047857">0</text>
<text x="356" y="172" fill="rgba(25,22,21,0.7)">4</text>
<text x="180" y="308" fill="rgba(25,22,21,0.7)">3</text>
<text x="356" y="304" fill="#191615">1</text>
</g>
<text x="356" y="319" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="rgba(25,22,21,0.48)" text-anchor="middle">d = |4 − 5| = 1</text>

<!-- arrows -->
<line x1="244" y1="194" x2="291" y2="241" stroke="#047857" stroke-width="2" stroke-linecap="round" marker-end="url(#ahG)"/>
<line x1="356" y1="195" x2="356" y2="240" stroke="rgb(140,137,134)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="245" y1="286" x2="290" y2="286" stroke="rgb(140,137,134)" stroke-width="1.25" stroke-linecap="round" marker-end="url(#ah)"/>

<!-- right panel -->
<rect x="470" y="92" width="298" height="252" rx="10" fill="#FBFAF7" stroke="rgba(25,22,21,0.3)" stroke-dasharray="3 3"/>
<text x="490" y="118" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">THE RECURRENCE</text>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#191615">
<text x="490" y="146">D(i,j) = d(i,j) + min of</text>
<text x="514" y="170" fill="#047857">D(i−1, j−1)</text>
<text x="514" y="192">D(i−1, j)</text>
<text x="514" y="214">D(i, j−1)</text>
</g>
<g font-size="12" fill="rgba(25,22,21,0.7)">
<text x="620" y="170">both advance</text>
<text x="620" y="192">a advances, b waits</text>
<text x="620" y="214">b advances, a waits</text>
</g>
<line x1="490" y1="236" x2="748" y2="236" stroke="rgba(25,22,21,0.15)" stroke-width="1"/>
<text x="490" y="262" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing=".08em" fill="rgba(25,22,21,0.48)">THIS CELL</text>
<g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#191615">
<text x="490" y="290">D(2,3) = 1 + min(<tspan fill="#047857" font-weight="500">0</tspan>, 4, 3)</text>
<text x="543" y="314">= 1</text>
</g>
<text x="490" y="334" font-size="12" fill="rgba(25,22,21,0.7)">The diagonal won, so the path came that way.</text>
</svg>
