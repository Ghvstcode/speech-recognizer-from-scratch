<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>The CTC lattice for the target ab over five frames</title>
<desc>A grid with time running left to right over five frames and the five positions of the extended target, blank a blank b blank, running top to bottom. Arrows show the allowed moves: stay in the same position, advance by one position, or skip the blank between a and b. Each cell holds its forward probability alpha. Paths start in the top two cells of frame 0 and end in the bottom two cells of frame 4, where 0.1557 plus 0.2948 gives 0.4505.</desc>
<rect width="100%" height="100%" fill="#F5F3EF"/>
<defs>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(25,22,21,0.08)"/></pattern>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.5,0.8 L7,4 L0.5,7.2 Z" fill="rgb(120,117,114)"/></marker>
<marker id="ahA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.5,0.8 L7,4 L0.5,7.2 Z" fill="#B45309"/></marker>
</defs>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="40" y="36" font-size="16" text-anchor="start" fill="rgba(25,22,21,1)" font-weight="500">The lattice for target “ab”, T = 5</text>
<text x="40" y="56" font-size="12.5" text-anchor="start" fill="rgba(25,22,21,0.7)" font-weight="400">Every path from a start cell to an end cell is one alignment. The number in a cell is its alpha.</text>
